<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
<title>カスタムエラーページ（開発途中）</title>
</head>
<body>
	<!-- エラー内容を表示 -->
	<h1 th:text="${status}"></h1>
	<p th:text="${message}"></p>
	<p th:text="${path}"></p>
	<p th:text="${timestamp}"></p>
 
	<form method="post" th:action="@{/logout}">
		<a class="button-style" href="/">一覧画面に戻る</a>
	</form>
 
</body>
</html>
